<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.28" />
    </linearGradient>
  </defs>

  <style>
    /* Dynamic Floating, Flowing, and Pulsing Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.08); }
    }
    @keyframes floatLeft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatRight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 180px 120px;
    }
    .pulse-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite 2s;
      transform-origin: 1040px 300px;
    }
    .flow-wave {
      stroke-dasharray: 20 12;
      animation: flowLine 24s linear infinite;
    }
    .float-card-l {
      animation: floatLeft 6s ease-in-out infinite;
    }
    .float-card-r {
      animation: floatRight 6.5s ease-in-out infinite 1s;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs (Strictly in Background) -->
  <circle class="pulse-orb-1" cx="180" cy="120" r="190" fill="url(#glowGrad1)" />
  <circle class="pulse-orb-2" cx="1040" cy="300" r="210" fill="url(#glowGrad2)" />

  <!-- Dynamic Subtle Waves (Strictly in Background) -->
  <g opacity="0.25">
    <path class="flow-wave" d="M -50 90 Q 300 210 600 120 T 1250 170" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-wave" d="M -50 330 Q 350 190 750 310 T 1250 250" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M 0 380 L 1200 380" stroke="#334155" stroke-width="1" stroke-dasharray="8 8" />
  </g>

  <!-- Dynamic Floating Decorative Glass Cards (Far Left & Far Right to Never Obstruct Text) -->
  <!-- Left Side Card -->
  <g class="float-card-l" transform="translate(60, 235)">
    <rect width="145" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="9" fill="#38bdf8" />
    <rect x="45" y="23" width="70" height="10" rx="5" fill="#475569" />
    <rect x="20" y="52" width="105" height="7" rx="3.5" fill="#334155" />
    <rect x="20" y="67" width="80" height="7" rx="3.5" fill="#334155" />
    <rect x="20" y="82" width="50" height="7" rx="3.5" fill="#38bdf8" opacity="0.85" />
  </g>

  <!-- Right Side Card -->
  <g class="float-card-r" transform="translate(995, 80)">
    <rect width="150" height="130" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" />
    <rect x="16" y="16" width="118" height="46" rx="6" fill="#1e293b" />
    <circle cx="75" cy="39" r="12" fill="#818cf8" opacity="0.8" />
    <rect x="16" y="74" width="80" height="8" rx="4" fill="#94a3b8" />
    <rect x="16" y="89" width="55" height="6" rx="3" fill="#64748b" />
    <rect x="16" y="103" width="46" height="14" rx="7" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5" stroke-width="0.8" />
    <text x="23" y="113" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#34d399">VERIFIED</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Sharp and Visible on All Renderers -->
  <!-- Top Category Pill Tag -->
  <g transform="translate(435, 55)">
    <rect width="330" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2" />
    <circle cx="22" cy="17" r="5" fill="#38bdf8" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="url(#accentTitle)">
    Website Theme Marketplace
  </text>

  <!-- Subtitle Description -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
    Storefronts, Template Discovery, SaaS Portals &amp; Open-Source Commerce Infrastructure
  </text>

  <!-- 4 Foreground Category Pills -->
  <g transform="translate(235, 235)">
    <!-- Pill 1: CMS Themes -->
    <g transform="translate(0, 0)">
      <rect width="170" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="8" fill="#3b82f6" fill-opacity="0.2" />
      <text x="24" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">WP</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Shopify &amp; WP</text>
    </g>

    <!-- Pill 2: Modern No-Code -->
    <g transform="translate(185, 0)">
      <rect width="170" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="8" fill="#a855f7" fill-opacity="0.2" />
      <text x="24" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c084fc">WF</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Webflow &amp; Framer</text>
    </g>

    <!-- Pill 3: Developer UI Kits -->
    <g transform="translate(370, 0)">
      <rect width="180" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="8" fill="#06b6d4" fill-opacity="0.2" />
      <text x="24" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">UI</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Tailwind, React &amp; Vue</text>
    </g>

    <!-- Pill 4: Open Source Engines -->
    <g transform="translate(565, 0)">
      <rect width="165" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="8" fill="#10b981" fill-opacity="0.2" />
      <text x="24" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34d399">OS</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Self-Hosted Engines</text>
    </g>
  </g>

  <!-- Bottom Value Proposition Text -->
  <g transform="translate(600, 325)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
      Multi-Vendor Marketplaces &nbsp;•&nbsp; Creator Payouts &nbsp;•&nbsp; Digital Goods Distribution &nbsp;•&nbsp; Licensing
    </text>
  </g>
</svg>
